<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ED2 — PageRank = Autovetor</title>
  <style>
    :root {
      --bg: #e8eef2;
      --stage: #f7f9fb;
      --panel: #ffffff;
      --ink: #15202b;
      --muted: #4a5d70;
      --accent: #0d7a68;
      --accent-soft: #d6efe9;
      --a: #1a6fd4;
      --b: #c7770a;
      --c: #c44066;
      --line: #c5d0db;
      --ok: #1a7a45;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.35;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5vh 2vw;
    }

    /* Palco ~4:3 centralizado (bordas laterais no widescreen do projetor) */
    .stage {
      width: min(96vw, calc(96vh * 4 / 3), 980px);
      max-height: 96vh;
      aspect-ratio: 4 / 3;
      background: var(--stage);
      border: 2px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(21, 32, 43, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (max-aspect-ratio: 4/3) {
      .stage {
        width: min(96vw, 980px);
        aspect-ratio: auto;
        height: auto;
        max-height: none;
      }
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1rem;
      align-items: flex-end;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.85rem;
      border-bottom: 2px solid var(--line);
      background: var(--panel);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.8vw, 1.95rem);
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    header p {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      font-weight: 500;
    }
    .brand {
      font-size: clamp(0.8rem, 1.3vw, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      font-weight: 700;
    }

    .steps {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .steps button {
      border: 2px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 0.65rem 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      font-weight: 700;
    }
    .steps button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .steps button:hover { border-color: var(--muted); }

    .fs-btn {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      padding: 0.75rem 1.15rem;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: clamp(1.05rem, 1.7vw, 1.25rem);
      font-weight: 800;
      white-space: nowrap;
    }
    .fs-btn:hover { filter: brightness(1.05); }
    .fs-btn.is-fs {
      background: var(--panel);
      color: var(--accent);
    }

    main {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 0.85rem;
      padding: 0.85rem 1.15rem 0.75rem;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 0.95rem 1.05rem 1.05rem;
      min-height: 0;
      overflow: auto;
    }
    .card h2 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.2rem, 2.2vw, 1.45rem);
      font-weight: 800;
    }
    .hint {
      color: var(--muted);
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      margin: 0 0 0.75rem;
      font-weight: 500;
    }

    .formula {
      font-family: var(--mono);
      font-size: clamp(1.55rem, 3.2vw, 2.15rem);
      font-weight: 700;
      text-align: center;
      padding: 1rem;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 2px dashed var(--accent);
      margin: 0.55rem 0 0.9rem;
      color: var(--ink);
    }
    .formula .lambda { color: var(--accent); }
    .bullets {
      margin: 0;
      padding-left: 1.25rem;
      font-size: clamp(1.05rem, 1.7vw, 1.25rem);
    }
    .bullets li { margin: 0.45rem 0; }

    .viz {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: min(38vh, 340px);
      margin: 0 auto;
      background: #eef3f7;
      border-radius: 12px;
      border: 2px solid var(--line);
      overflow: hidden;
    }
    svg { width: 100%; height: 100%; display: block; }
    .node circle {
      stroke-width: 3;
      transition: r 0.35s ease;
    }
    .node text {
      font-family: var(--font);
      font-weight: 800;
      fill: #ffffff;
      font-size: 22px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .edge {
      fill: none;
      stroke: #5a6f82;
      stroke-width: 2.8;
      marker-end: url(#arrow);
      opacity: 0.9;
    }
    .rank-label {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
    }

    .bars { display: grid; gap: 0.65rem; margin-top: 0.55rem; }
    .bar-row {
      display: grid;
      grid-template-columns: 36px 1fr 78px;
      gap: 0.55rem;
      align-items: center;
    }
    .bar-row .name {
      font-weight: 800;
      font-size: clamp(1.1rem, 1.8vw, 1.3rem);
    }
    .track {
      height: 32px;
      background: #e4ebf1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--line);
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 0.45s ease;
    }
    .fill.A { background: var(--a); }
    .fill.B { background: var(--b); }
    .fill.C { background: var(--c); }
    .pct {
      font-family: var(--mono);
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 700;
      text-align: right;
    }

    .matrix-wrap {
      overflow-x: auto;
      font-family: var(--mono);
      font-size: clamp(1.05rem, 1.8vw, 1.25rem);
    }
    table.mat {
      border-collapse: collapse;
      margin: 0.3rem auto;
    }
    table.mat th, table.mat td {
      border: 2px solid var(--line);
      padding: 0.55rem 0.8rem;
      text-align: center;
      min-width: 3.6rem;
      font-weight: 700;
    }
    table.mat th {
      color: var(--muted);
      background: #eef3f7;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin: 0.85rem 0 0.35rem;
    }
    .controls button, .ghost {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      padding: 0.7rem 1.05rem;
      border-radius: 10px;
      cursor: pointer;
    }
    .controls button.secondary, .ghost {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line);
    }
    .controls button:disabled { opacity: 0.45; cursor: default; }

    .status {
      min-height: 1.5rem;
      font-family: var(--mono);
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      font-weight: 700;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .status.ok { color: var(--ok); }

    .check {
      display: grid;
      gap: 0.4rem;
      font-family: var(--mono);
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 700;
      background: #eef3f7;
      border-radius: 10px;
      padding: 0.85rem 0.95rem;
      border: 2px solid var(--line);
      margin-top: 0.65rem;
    }

    footer {
      padding: 0.55rem 1.25rem 0.75rem;
      color: var(--muted);
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      font-weight: 500;
      border-top: 2px solid var(--line);
      background: var(--panel);
      flex-shrink: 0;
    }
    kbd {
      font-family: var(--mono);
      font-size: 0.9em;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
      background: #eef3f7;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="stage">
  <header>
    <div>
      <div class="brand">Álgebra Linear · ED2</div>
      <h1>PageRank: o ranking é um autovetor</h1>
      <p>3 páginas · matriz de links G · Gv = λv com λ = 1</p>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:0.55rem; align-items:center;">
      <nav class="steps" aria-label="Etapas da apresentação">
        <button type="button" data-step="0" class="active">1. Ideia</button>
        <button type="button" data-step="1">2. Grafo</button>
        <button type="button" data-step="2">3. Iterar</button>
        <button type="button" data-step="3">4. Conferir</button>
      </nav>
      <button type="button" class="fs-btn" id="btn-fs" title="Tela cheia (ou F11)">Tela cheia</button>
    </div>
  </header>

  <main>
    <section class="card" id="left">
      <!-- filled by JS -->
    </section>
    <aside class="card" id="right">
      <!-- filled by JS -->
    </aside>
  </main>

  <footer>
    Exemplo das notas ED2 (A → B,C · B → A,C · C → A). Atalhos: <kbd>1</kbd>–<kbd>4</kbd> ·
    <kbd>Espaço</kbd> / <kbd>→</kbd> · <kbd>←</kbd> · <kbd>F11</kbd> / botão Tela cheia.
    Steinbruch Cap. 6 · Brin &amp; Page, 1998. · Tema claro · palco 4:3.
  </footer>
  </div>

  <script>
    // Matriz Google do exemplo (colunas somam 1). Ordem A, B, C.
    const G = [
      [0,   0.5, 1],
      [0.5, 0,   0],
      [0.5, 0.5, 0],
    ];
    const EXACT = [4 / 9, 2 / 9, 1 / 3];
    const NAMES = ["A", "B", "C"];
    const COLORS = { A: "#1a6fd4", B: "#c7770a", C: "#c44066" };

    let step = 0;
    let v = [1 / 3, 1 / 3, 1 / 3];
    let iter = 0;
    let animating = false;

    const left = document.getElementById("left");
    const right = document.getElementById("right");
    const stepBtns = [...document.querySelectorAll(".steps button")];

    function fmt(x, d = 3) {
      return (Math.round(x * 10 ** d) / 10 ** d).toFixed(d);
    }
    function pct(x) {
      return (100 * x).toFixed(1) + "%";
    }
    function matvec(A, x) {
      return A.map((row) => row.reduce((s, aij, j) => s + aij * x[j], 0));
    }
    function normalize(x) {
      const s = x.reduce((a, b) => a + b, 0);
      return x.map((t) => t / s);
    }
    function almostEq(a, b, eps = 1e-9) {
      return a.every((ai, i) => Math.abs(ai - b[i]) < eps);
    }

    function setStep(n) {
      step = Math.max(0, Math.min(3, n));
      stepBtns.forEach((b, i) => b.classList.toggle("active", i === step));
      if (step < 2) {
        v = [1 / 3, 1 / 3, 1 / 3];
        iter = 0;
      }
      if (step === 3) {
        v = EXACT.slice();
        iter = "∞";
      }
      render();
    }

    function barsHTML(vec, title) {
      return `
        <h2>${title}</h2>
        <div class="bars">
          ${NAMES.map((name, i) => `
            <div class="bar-row">
              <div class="name" style="color:${COLORS[name]}">${name}</div>
              <div class="track"><div class="fill ${name}" style="width:${Math.max(2, 100 * vec[i])}%"></div></div>
              <div class="pct">${pct(vec[i])}</div>
            </div>
          `).join("")}
        </div>`;
    }

    function graphSVG(vec) {
      const pos = {
        A: [110, 95],
        B: [290, 95],
        C: [200, 275],
      };
      const rBase = 34;
      const rs = vec.map((w) => rBase + 48 * w);

      // curved edges with mid control points
      const edges = [
        ["A", "B"], ["A", "C"],
        ["B", "A"], ["B", "C"],
        ["C", "A"],
      ];

      function path(from, to) {
        const [x1, y1] = pos[from];
        const [x2, y2] = pos[to];
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        // slight bend so A↔B don't overlap
        const dx = x2 - x1, dy = y2 - y1;
        const nx = -dy * 0.12, ny = dx * 0.12;
        const sign = from < to ? 1 : -1;
        return `M ${x1} ${y1} Q ${mx + sign * nx} ${my + sign * ny} ${x2} ${y2}`;
      }

      return `
        <div class="viz" aria-label="Grafo de três páginas">
          <svg viewBox="0 0 400 400" role="img">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6f82" />
              </marker>
            </defs>
            ${edges.map(([f, t]) =>
              `<path class="edge" d="${path(f, t)}" />`
            ).join("")}
            ${NAMES.map((name, i) => {
              const [x, y] = pos[name];
              const r = rs[i];
              return `
                <g class="node">
                  <circle cx="${x}" cy="${y}" r="${r}" fill="${COLORS[name]}" stroke="#15202b" />
                  <text x="${x}" y="${y}">${name}</text>
                  <text class="rank-label" x="${x}" y="${y + r + 20}">${pct(vec[i])}</text>
                </g>`;
            }).join("")}
          </svg>
        </div>`;
    }

    function matrixHTML() {
      const labels = ["", "A", "B", "C"];
      return `
        <div class="matrix-wrap">
          <table class="mat" aria-label="Matriz G">
            <tr>${labels.map((h) => `<th>${h || "G"}</th>`).join("")}</tr>
            ${G.map((row, i) => `
              <tr>
                <th>${NAMES[i]}</th>
                ${row.map((x) => `<td>${x === 0.5 ? "1/2" : x}</td>`).join("")}
              </tr>
            `).join("")}
          </table>
        </div>
        <p class="hint" style="margin-top:0.55rem">Cada coluna soma 1 → “quem sai de uma página redistribui 100% do peso”. Por isso λ = 1.</p>`;
    }

    async function powerStep(times = 1) {
      if (animating) return;
      animating = true;
      const btn = document.getElementById("btn-iter");
      const btnRun = document.getElementById("btn-run");
      if (btn) btn.disabled = true;
      if (btnRun) btnRun.disabled = true;

      for (let t = 0; t < times; t++) {
        v = normalize(matvec(G, v));
        iter = (typeof iter === "number" ? iter : 0) + 1;
        render();
        await new Promise((r) => setTimeout(r, 420));
        if (almostEq(v, EXACT, 1e-4)) break;
      }

      animating = false;
      render();
    }

    function jumpExact() {
      v = EXACT.slice();
      iter = "exato";
      render();
    }

    function renderIdea() {
      left.innerHTML = `
        <h2>Autovetor = direção que não muda</h2>
        <p class="hint">Mesma ideia da Aula 10: a matriz pode girar o plano, mas em algumas direções só estica.</p>
        <div class="formula">A<span style="opacity:.7"> </span><strong>v</strong> = <span class="lambda">λ</span><strong>v</strong></div>
        <ul class="bullets">
          <li><strong>v ≠ 0</strong> — a direção estável</li>
          <li><strong>λ</strong> — estica (λ&gt;1), encolhe (0&lt;λ&lt;1) ou inverte (λ&lt;0)</li>
          <li>No PageRank: <strong>λ = 1</strong> e <strong>v</strong> é o ranking das páginas</li>
        </ul>`;
      right.innerHTML = `
        <h2>Onde a computação usa</h2>
        <p class="hint">Três áreas — uma frase cada (slide 3).</p>
        <ul class="bullets">
          <li><strong>Busca</strong> — peso da página (PageRank)</li>
          <li><strong>Imagens/dados</strong> — eixo principal (PCA / eigenfaces)</li>
          <li><strong>Redes</strong> — importância do nó</li>
        </ul>
        <p class="hint" style="margin-top:1rem">Nesta demo: só a área de <strong>busca</strong>, com 3 páginas.</p>
        <div class="controls">
          <button type="button" onclick="setStep(1)">Ver o grafo →</button>
        </div>`;
    }

    function renderGraph() {
      left.innerHTML = `
        <h2>Três páginas e os links</h2>
        <p class="hint">A → B e C · B → A e C · C → só A. O tamanho do nó mostra o peso atual (ainda uniforme).</p>
        ${graphSVG(v)}
        <p class="hint" style="margin-top:0.7rem">Intuição: C manda tudo para A → A tende a ficar em 1º.</p>`;
      right.innerHTML = `
        <h2>Matriz de links G</h2>
        ${matrixHTML()}
        <div class="controls">
          <button type="button" class="secondary" onclick="setStep(0)">← Ideia</button>
          <button type="button" onclick="setStep(2)">Iterar PageRank →</button>
        </div>`;
    }

    function renderIter() {
      const close = almostEq(v, EXACT, 5e-3);
      left.innerHTML = `
        <h2>Iteração: v ← Gv (normalizado)</h2>
        <p class="hint">Começa uniforme. Cada passo redistribui o “voto” pelos links — método da potência.</p>
        ${graphSVG(v)}
        <div class="controls">
          <button type="button" id="btn-iter" onclick="powerStep(1)">1 passo</button>
          <button type="button" id="btn-run" class="secondary" onclick="powerStep(12)">Rodar até estabilizar</button>
          <button type="button" class="secondary" onclick="jumpExact()">Ir ao exato</button>
        </div>
        <div class="status ${close ? "ok" : ""}" id="status">
          iteração ${iter} · ${close ? "próximo do autovetor exato ✓" : "ainda convergindo…"}
        </div>`;
      right.innerHTML = `
        ${barsHTML(v, "Ranking atual")}
        <p class="hint" style="margin-top:0.8rem">Alvo da folha: A = 4/9 ≈ 44,4% · C = 1/3 ≈ 33,3% · B = 2/9 ≈ 22,2%</p>
        ${barsHTML(EXACT, "Alvo (folha ED2)")}
        <div class="controls">
          <button type="button" class="secondary" onclick="setStep(1)">← Grafo</button>
          <button type="button" onclick="setStep(3)">Conferir Gv = v →</button>
        </div>`;
    }

    function renderCheck() {
      const gv = matvec(G, EXACT);
      left.innerHTML = `
        <h2>Conferência: Gv = v</h2>
        <p class="hint">Mesma conta da aula: (G − I)v = 0 com λ = 1. O ranking é autovetor.</p>
        ${graphSVG(EXACT)}
        <div class="check">
          <div>v  = (${fmt(EXACT[0], 4)}, ${fmt(EXACT[1], 4)}, ${fmt(EXACT[2], 4)})</div>
          <div>Gv = (${fmt(gv[0], 4)}, ${fmt(gv[1], 4)}, ${fmt(gv[2], 4)})</div>
          <div style="color:var(--ok)">Gv = v ? ${almostEq(gv, EXACT) ? "sim ✓" : "não"}</div>
          <div>Ranking: <strong style="color:${COLORS.A}">A 4/9</strong> &gt;
            <strong style="color:${COLORS.C}">C 1/3</strong> &gt;
            <strong style="color:${COLORS.B}">B 2/9</strong></div>
        </div>`;
      right.innerHTML = `
        <h2>Fecho (30 s)</h2>
        <ul class="bullets">
          <li>Autovetor = direção que a transformação não muda</li>
          <li>Busca, imagens/dados e redes usam isso</li>
          <li>No exemplo, o ranking da web <em>é</em> esse vetor</li>
        </ul>
        <p class="hint" style="margin-top:0.9rem">Bibliografia: Steinbruch Cap. 6 · Brin &amp; Page 1998 · Turk &amp; Pentland 1991 (eigenfaces).</p>
        <div class="controls">
          <button type="button" class="secondary" onclick="setStep(2)">← Iterar</button>
          <button type="button" class="secondary" onclick="setStep(0)">Recomeçar</button>
        </div>`;
    }

    function render() {
      if (step === 0) renderIdea();
      else if (step === 1) renderGraph();
      else if (step === 2) renderIter();
      else renderCheck();
    }

    stepBtns.forEach((b) => b.addEventListener("click", () => setStep(+b.dataset.step)));

    const fsBtn = document.getElementById("btn-fs");
    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function syncFsBtn() {
      const on = isFullscreen();
      fsBtn.textContent = on ? "Sair da tela cheia" : "Tela cheia";
      fsBtn.classList.toggle("is-fs", on);
      fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
    }
    async function toggleFullscreen() {
      try {
        if (isFullscreen()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) await exit.call(document);
        } else {
          const el = document.documentElement;
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) await req.call(el);
          else alert("Fullscreen API indisponível — use F11.");
        }
      } catch (err) {
        alert("Não deu para alternar tela cheia. Use F11.");
      }
      syncFsBtn();
    }
    fsBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", syncFsBtn);
    document.addEventListener("webkitfullscreenchange", syncFsBtn);

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea")) return;
      if (e.key >= "1" && e.key <= "4") setStep(+e.key - 1);
      else if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        if (step === 2 && e.key === " ") powerStep(1);
        else setStep(step + 1);
      } else if (e.key === "ArrowLeft") setStep(step - 1);
    });

    // expose for inline handlers
    window.setStep = setStep;
    window.powerStep = powerStep;
    window.jumpExact = jumpExact;

    syncFsBtn();
    setStep(0);
  </script>
</body>
</html>
