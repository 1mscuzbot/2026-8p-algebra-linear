<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ED2 — PageRank = Autovetor</title>
  <style>
    :root {
      --bg: #e8eef2;
      --stage: #f7f9fb;
      --panel: #ffffff;
      --ink: #15202b;
      --muted: #4a5d70;
      --accent: #0d7a68;
      --accent-soft: #d6efe9;
      --a: #1a6fd4;
      --b: #c7770a;
      --c: #c44066;
      --line: #c5d0db;
      --ok: #1a7a45;
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.25;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1vh 1.5vw;
      text-transform: uppercase;
    }

    /* Palco 4:3 — cabe na viewport, sem scroll */
    .stage {
      width: min(98vw, calc(98vh * 4 / 3));
      height: min(98vh, calc(98vw * 3 / 4));
      max-width: 1100px;
      max-height: 825px;
      background: var(--stage);
      border: 2px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(21, 32, 43, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-transform: uppercase;
    }
    /* Tela cheia: centraliza o palco 4:3 na viewport (não cola à esquerda) */
    html:fullscreen,
    html:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #111;
    }
    html:fullscreen body,
    html:-webkit-full-screen body,
    body:fullscreen,
    body:-webkit-full-screen {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html:fullscreen .stage,
    html:-webkit-full-screen .stage,
    body:fullscreen .stage,
    body:-webkit-full-screen .stage {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      max-width: none;
      max-height: none;
      margin: auto;
      border-radius: 0;
      border-width: 0;
      flex-shrink: 0;
    }

    /* Header compacto — só o topo do palco */
    header {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.4rem 0.65rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.7rem;
      border-bottom: 2px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
    }
    header h1 {
      margin: 0;
      font-size: clamp(0.95rem, 2.2vh, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
    header p {
      display: none; /* subtítulo fora — libera altura pro slide */
    }
    .brand {
      font-size: clamp(0.6rem, 1.15vh, 0.75rem);
      letter-spacing: 0.12em;
      color: var(--accent);
      font-weight: 800;
      line-height: 1.1;
    }
    .header-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.35rem;
      align-items: center;
      flex-shrink: 0;
    }

    .steps {
      display: flex;
      gap: 0.25rem;
      flex-wrap: nowrap;
    }
    .steps button {
      border: 2px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 0.3rem 0.5rem;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-size: clamp(0.68rem, 1.45vh, 0.88rem);
      font-weight: 800;
      text-transform: uppercase;
    }
    .steps button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .steps button:hover { border-color: var(--muted); }

    .fs-btn {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      padding: 0.3rem 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      font-size: clamp(0.7rem, 1.5vh, 0.9rem);
      font-weight: 800;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .fs-btn:hover { filter: brightness(1.05); }
    .fs-btn.is-fs {
      background: var(--panel);
      color: var(--accent);
    }

    /* Área principal preenche toda a altura restante */
    main {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      grid-template-rows: 1fr;
      gap: 0.65rem;
      padding: 0.65rem 0.75rem;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      align-items: stretch;
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.55rem;
    }
    .card h2 {
      margin: 0;
      font-size: clamp(1.05rem, 2.6vh, 1.55rem);
      font-weight: 800;
      flex: 0 0 auto;
    }
    .hint {
      color: var(--muted);
      font-size: clamp(0.8rem, 1.7vh, 1.05rem);
      margin: 0;
      font-weight: 600;
      flex: 0 0 auto;
    }

    .body-block {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 0.55rem;
    }

    .formula {
      font-family: var(--mono);
      font-size: clamp(1.55rem, 4.2vh, 2.4rem);
      font-weight: 800;
      text-align: center;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 2px dashed var(--accent);
      margin: 0;
      color: var(--ink);
      text-transform: none;
    }
    .formula .lambda { color: var(--accent); }
    .bullets {
      margin: 0;
      padding-left: 1.25rem;
      font-size: clamp(0.95rem, 2.2vh, 1.3rem);
      font-weight: 600;
    }
    .bullets li { margin: 0.45rem 0; }

    /* Slot do grafo cresce e centraliza o quadrado */
    .viz-slot {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viz {
      position: relative;
      width: min(100%, 52vh);
      height: min(100%, 52vh);
      aspect-ratio: 1 / 1;
      max-width: 100%;
      max-height: 100%;
      background: #eef3f7;
      border-radius: 10px;
      border: 2px solid var(--line);
      overflow: hidden;
    }
    svg { width: 100%; height: 100%; display: block; }
    .node circle {
      stroke-width: 3;
      transition: r 0.35s ease;
    }
    .node-letter {
      font-family: var(--font);
      font-weight: 800;
      fill: #ffffff;
      font-size: 24px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .edge {
      fill: none;
      stroke: #5a6f82;
      stroke-width: 2.8;
      marker-end: url(#arrow);
      opacity: 0.9;
    }
    .rank-label {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 800;
      fill: #15202b;
      stroke: #ffffff;
      stroke-width: 3.5px;
      paint-order: stroke fill;
      text-anchor: middle;
      pointer-events: none;
      letter-spacing: 0;
    }

    .bars {
      display: grid;
      gap: 0.85rem;
      flex: 1 1 auto;
      align-content: space-evenly;
      width: 100%;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.3rem;
      width: 100%;
    }
    .bar-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
    }
    .bar-row .name {
      font-weight: 800;
      font-size: clamp(1.05rem, 2.4vh, 1.4rem);
    }
    .track {
      width: 100%;
      height: clamp(28px, 4.5vh, 48px);
      background: #e4ebf1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--line);
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 0.45s ease;
    }
    .fill.A { background: var(--a); }
    .fill.B { background: var(--b); }
    .fill.C { background: var(--c); }
    .pct {
      font-family: var(--mono);
      font-size: clamp(0.78rem, 1.7vh, 1.05rem);
      font-weight: 800;
      text-align: right;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0;
      text-transform: none;
    }

    .matrix-wrap {
      font-family: var(--mono);
      font-size: clamp(1rem, 2.2vh, 1.3rem);
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    table.mat {
      border-collapse: collapse;
      margin: 0 auto;
    }
    table.mat th, table.mat td {
      border: 2px solid var(--line);
      padding: 0.45rem 0.7rem;
      text-align: center;
      min-width: 3rem;
      font-weight: 800;
    }
    table.mat th {
      color: var(--muted);
      background: #eef3f7;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0;
      flex: 0 0 auto;
      padding-top: 0.15rem;
    }
    .controls button, .ghost {
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      font-size: clamp(0.8rem, 1.7vh, 1.05rem);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .controls button.secondary, .ghost {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line);
    }
    .controls button:disabled { opacity: 0.45; cursor: default; }

    .status {
      font-family: var(--mono);
      font-size: clamp(0.78rem, 1.55vh, 0.98rem);
      font-weight: 800;
      color: var(--muted);
      margin: 0;
      flex: 0 0 auto;
    }
    .status.ok { color: var(--ok); }

    .check {
      display: grid;
      gap: 0.4rem;
      font-family: var(--mono);
      font-size: clamp(0.9rem, 1.9vh, 1.15rem);
      font-weight: 800;
      background: #eef3f7;
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      border: 2px solid var(--line);
      margin: 0;
      text-transform: none;
      flex: 0 0 auto;
    }

    /* Footer grudado no fundo do palco */
    footer {
      padding: 0.28rem 0.75rem;
      color: var(--muted);
      font-size: clamp(0.58rem, 1.1vh, 0.75rem);
      font-weight: 600;
      border-top: 2px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      margin-top: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    kbd {
      font-family: var(--mono);
      font-size: 0.95em;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.02rem 0.28rem;
      background: #eef3f7;
      color: var(--ink);
      text-transform: none;
    }
  </style>
</head>
<body>
  <div class="stage">
  <header>
    <div>
      <div class="brand">Álgebra Linear · ED2</div>
      <h1>PageRank: o ranking é um autovetor</h1>
      <p>3 páginas · matriz de links G · Gv = λv com λ = 1</p>
    </div>
    <div class="header-actions">
      <nav class="steps" aria-label="Etapas da apresentação">
        <button type="button" data-step="0" class="active">1. Ideia</button>
        <button type="button" data-step="1">2. Grafo</button>
        <button type="button" data-step="2">3. Iterar</button>
        <button type="button" data-step="3">4. Conferir</button>
      </nav>
      <button type="button" class="fs-btn" id="btn-fs" title="Tela cheia (ou F11)">Tela cheia</button>
    </div>
  </header>

  <main>
    <section class="card" id="left">
      <!-- filled by JS -->
    </section>
    <aside class="card" id="right">
      <!-- filled by JS -->
    </aside>
  </main>

  <footer>
    Exemplo das notas ED2 (A → B,C · B → A,C · C → A). Atalhos: <kbd>1</kbd>–<kbd>4</kbd> ·
    <kbd>Espaço</kbd> / <kbd>→</kbd> · <kbd>←</kbd> · <kbd>F11</kbd> / botão Tela cheia.
    Steinbruch Cap. 6 · Brin &amp; Page, 1998. · Tema claro · palco 4:3.
  </footer>
  </div>

  <script>
    // Matriz Google do exemplo (colunas somam 1). Ordem A, B, C.
    const G = [
      [0,   0.5, 1],
      [0.5, 0,   0],
      [0.5, 0.5, 0],
    ];
    const EXACT = [4 / 9, 2 / 9, 1 / 3];
    const NAMES = ["A", "B", "C"];
    const COLORS = { A: "#1a6fd4", B: "#c7770a", C: "#c44066" };

    let step = 0;
    let v = [1 / 3, 1 / 3, 1 / 3];
    let iter = 0;
    let animating = false;

    const left = document.getElementById("left");
    const right = document.getElementById("right");
    const stepBtns = [...document.querySelectorAll(".steps button")];

    function fmt(x, d = 3) {
      return (Math.round(x * 10 ** d) / 10 ** d).toFixed(d);
    }
    function pct(x) {
      // Muitas casas + vírgula BR: a mudança a cada iteração fica visível
      return (100 * x).toFixed(6).replace(".", ",") + "%";
    }
    function matvec(A, x) {
      return A.map((row) => row.reduce((s, aij, j) => s + aij * x[j], 0));
    }
    function normalize(x) {
      const s = x.reduce((a, b) => a + b, 0);
      return x.map((t) => t / s);
    }
    function almostEq(a, b, eps = 1e-9) {
      return a.every((ai, i) => Math.abs(ai - b[i]) < eps);
    }

    function setStep(n) {
      step = Math.max(0, Math.min(3, n));
      stepBtns.forEach((b, i) => b.classList.toggle("active", i === step));
      if (step < 2) {
        v = [1 / 3, 1 / 3, 1 / 3];
        iter = 0;
      }
      if (step === 3) {
        v = EXACT.slice();
        iter = "∞";
      }
      render();
    }

    function barsHTML(vec, title) {
      return `
        <h2>${title}</h2>
        <div class="body-block">
          <div class="bars">
            ${NAMES.map((name, i) => `
              <div class="bar-row">
                <div class="bar-meta">
                  <div class="name" style="color:${COLORS[name]}">${name}</div>
                  <div class="pct">${pct(vec[i])}</div>
                </div>
                <div class="track"><div class="fill ${name}" style="width:${Math.max(2, 100 * vec[i])}%"></div></div>
              </div>
            `).join("")}
          </div>
        </div>`;
    }

    function graphSVG(vec) {
      const pos = {
        A: [110, 95],
        B: [290, 95],
        C: [200, 275],
      };
      const rBase = 34;
      const rs = vec.map((w) => rBase + 48 * w);

      // curved edges with mid control points
      const edges = [
        ["A", "B"], ["A", "C"],
        ["B", "A"], ["B", "C"],
        ["C", "A"],
      ];

      function path(from, to) {
        const [x1, y1] = pos[from];
        const [x2, y2] = pos[to];
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        // slight bend so A↔B don't overlap
        const dx = x2 - x1, dy = y2 - y1;
        const nx = -dy * 0.12, ny = dx * 0.12;
        const sign = from < to ? 1 : -1;
        return `M ${x1} ${y1} Q ${mx + sign * nx} ${my + sign * ny} ${x2} ${y2}`;
      }

      return `
        <div class="viz-slot">
          <div class="viz" aria-label="Grafo de três páginas">
            <svg viewBox="0 0 400 400" role="img">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6f82" />
                </marker>
              </defs>
              ${edges.map(([f, t]) =>
                `<path class="edge" d="${path(f, t)}" />`
              ).join("")}
              ${NAMES.map((name, i) => {
                const [x, y] = pos[name];
                const r = rs[i];
                return `
                  <g class="node">
                    <circle cx="${x}" cy="${y}" r="${r}" fill="${COLORS[name]}" stroke="#15202b" />
                    <text class="node-letter" x="${x}" y="${y}">${name}</text>
                  </g>
                  <text class="rank-label" x="${x}" y="${y + r + 22}">${pct(vec[i])}</text>`;
              }).join("")}
            </svg>
          </div>
        </div>`;
    }

    function matrixHTML() {
      const labels = ["", "A", "B", "C"];
      return `
        <div class="body-block">
          <div class="matrix-wrap">
            <table class="mat" aria-label="Matriz G">
              <tr>${labels.map((h) => `<th>${h || "G"}</th>`).join("")}</tr>
              ${G.map((row, i) => `
                <tr>
                  <th>${NAMES[i]}</th>
                  ${row.map((x) => `<td>${x === 0.5 ? "1/2" : x}</td>`).join("")}
                </tr>
              `).join("")}
            </table>
          </div>
          <p class="hint">Colunas somam 1 → λ = 1.</p>
        </div>`;
    }

    async function powerStep(times = 1) {
      if (animating) return;
      animating = true;
      const btn = document.getElementById("btn-iter");
      const btnRun = document.getElementById("btn-run");
      if (btn) btn.disabled = true;
      if (btnRun) btnRun.disabled = true;

      for (let t = 0; t < times; t++) {
        v = normalize(matvec(G, v));
        iter = (typeof iter === "number" ? iter : 0) + 1;
        render();
        await new Promise((r) => setTimeout(r, 420));
        if (almostEq(v, EXACT, 1e-4)) break;
      }

      animating = false;
      render();
    }

    function jumpExact() {
      v = EXACT.slice();
      iter = "exato";
      render();
    }

    function renderIdea() {
      left.innerHTML = `
        <h2>Autovetor = direção que não muda</h2>
        <p class="hint">Aula 10: a matriz estica só o tamanho nesta direção.</p>
        <div class="body-block">
          <div class="formula">A <strong>v</strong> = <span class="lambda">λ</span><strong>v</strong></div>
          <ul class="bullets">
            <li><strong>v ≠ 0</strong> — direção estável</li>
            <li><strong>λ</strong> — estica / encolhe / inverte</li>
            <li>PageRank: <strong>λ = 1</strong>, <strong>v</strong> = ranking</li>
          </ul>
        </div>`;
      right.innerHTML = `
        <h2>Onde a computação usa</h2>
        <p class="hint">Três áreas — uma frase cada.</p>
        <div class="body-block">
          <ul class="bullets">
            <li><strong>Busca</strong> — peso da página (PageRank)</li>
            <li><strong>Imagens/dados</strong> — eixo principal (PCA)</li>
            <li><strong>Redes</strong> — importância do nó</li>
          </ul>
          <p class="hint">Demo: só busca, 3 páginas.</p>
        </div>
        <div class="controls">
          <button type="button" onclick="setStep(1)">Ver o grafo →</button>
        </div>`;
    }

    function renderGraph() {
      left.innerHTML = `
        <h2>Três páginas e os links</h2>
        <p class="hint">A→B,C · B→A,C · C→A. Nó = peso (uniforme).</p>
        ${graphSVG(v)}
        <p class="hint">C manda tudo para A → A sobe.</p>`;
      right.innerHTML = `
        <h2>Matriz de links G</h2>
        ${matrixHTML()}
        <div class="controls">
          <button type="button" class="secondary" onclick="setStep(0)">← Ideia</button>
          <button type="button" onclick="setStep(2)">Iterar →</button>
        </div>`;
    }

    function renderIter() {
      const close = almostEq(v, EXACT, 5e-3);
      left.innerHTML = `
        <h2>Iteração: v ← Gv</h2>
        <p class="hint">Cada passo redistribui o voto (método da potência).</p>
        ${graphSVG(v)}
        <div class="controls">
          <button type="button" id="btn-iter" onclick="powerStep(1)">1 passo</button>
          <button type="button" id="btn-run" class="secondary" onclick="powerStep(12)">Estabilizar</button>
          <button type="button" class="secondary" onclick="jumpExact()">Exato</button>
        </div>
        <div class="status ${close ? "ok" : ""}" id="status">
          iter ${iter} · ${close ? "próximo do exato ✓" : "convergindo…"}
        </div>`;
      right.innerHTML = `
        ${barsHTML(v, "Ranking atual")}
        <p class="hint">Alvo: A 4/9 · C 1/3 · B 2/9</p>
        ${barsHTML(EXACT, "Alvo (folha)")}
        <div class="controls">
          <button type="button" class="secondary" onclick="setStep(1)">← Grafo</button>
          <button type="button" onclick="setStep(3)">Conferir →</button>
        </div>`;
    }

    function renderCheck() {
      const gv = matvec(G, EXACT);
      left.innerHTML = `
        <h2>Conferência: Gv = v</h2>
        <p class="hint">(G − I)v = 0 com λ = 1. Ranking = autovetor.</p>
        ${graphSVG(EXACT)}
        <div class="check">
          <div>v  = (${fmt(EXACT[0], 4)}, ${fmt(EXACT[1], 4)}, ${fmt(EXACT[2], 4)})</div>
          <div>Gv = (${fmt(gv[0], 4)}, ${fmt(gv[1], 4)}, ${fmt(gv[2], 4)})</div>
          <div style="color:var(--ok)">Gv = v ? ${almostEq(gv, EXACT) ? "sim ✓" : "não"}</div>
          <div>Ranking: <strong style="color:${COLORS.A}">A 4/9</strong> &gt;
            <strong style="color:${COLORS.C}">C 1/3</strong> &gt;
            <strong style="color:${COLORS.B}">B 2/9</strong></div>
        </div>`;
      right.innerHTML = `
        <h2>Fecho (30 s)</h2>
        <div class="body-block">
          <ul class="bullets">
            <li>Autovetor = direção que não muda</li>
            <li>Busca, imagens/dados e redes</li>
            <li>O ranking da web <em>é</em> esse vetor</li>
          </ul>
          <p class="hint">Steinbruch Cap. 6 · Brin &amp; Page 1998</p>
        </div>
        <div class="controls">
          <button type="button" class="secondary" onclick="setStep(2)">← Iterar</button>
          <button type="button" class="secondary" onclick="setStep(0)">Recomeçar</button>
        </div>`;
    }

    function render() {
      if (step === 0) renderIdea();
      else if (step === 1) renderGraph();
      else if (step === 2) renderIter();
      else renderCheck();
    }

    stepBtns.forEach((b) => b.addEventListener("click", () => setStep(+b.dataset.step)));

    const fsBtn = document.getElementById("btn-fs");
    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function syncFsBtn() {
      const on = isFullscreen();
      fsBtn.textContent = on ? "Sair da tela cheia" : "Tela cheia";
      fsBtn.classList.toggle("is-fs", on);
      fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
    }
    async function toggleFullscreen() {
      try {
        if (isFullscreen()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) await exit.call(document);
        } else {
          const el = document.body;
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) await req.call(el);
          else alert("Fullscreen API indisponível — use F11.");
        }
      } catch (err) {
        alert("Não deu para alternar tela cheia. Use F11.");
      }
      syncFsBtn();
    }
    fsBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", syncFsBtn);
    document.addEventListener("webkitfullscreenchange", syncFsBtn);

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea")) return;
      if (e.key >= "1" && e.key <= "4") setStep(+e.key - 1);
      else if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        if (step === 2 && e.key === " ") powerStep(1);
        else setStep(step + 1);
      } else if (e.key === "ArrowLeft") setStep(step - 1);
    });

    // expose for inline handlers
    window.setStep = setStep;
    window.powerStep = powerStep;
    window.jumpExact = jumpExact;

    syncFsBtn();
    setStep(0);
  </script>
</body>
</html>
